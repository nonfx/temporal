name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build from"
        required: true
        default: "main"
      cli-version:
        description: "Temporal CLI version to include in images"
        required: true
        default: "1.5.1"
      alpine-tag:
        description: "Alpine base image tag (e.g., 3.23.3)"
        required: true
        default: "3.23.3"
      push:
        description: "Push images to Docker Hub"
        required: true
        type: boolean
        default: false
      tag-latest:
        description: "Tag images as latest"
        required: true
        type: boolean
        default: false
      platform:
        description: "Platform to build (leave empty for multi-arch, or specify linux/amd64 or linux/arm64)"
        required: false
        default: ""
      snapshot:
        description: "Build in snapshot mode (for non-release builds)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Determine single-arch parameter
        id: arch-param
        run: |
          if [ -n "${{ inputs.platform }}" ]; then
            # Extract arch from platform (e.g., linux/amd64 -> amd64)
            ARCH=$(echo "${{ inputs.platform }}" | cut -d'/' -f2)
            echo "single-arch=${ARCH}" >> "$GITHUB_OUTPUT"
          else
            echo "single-arch=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        uses: ./.github/actions/build-binaries
        with:
          snapshot: ${{ inputs.snapshot }}
          single-arch: ${{ steps.arch-param.outputs.single-arch }}

      - name: Build Docker images
        if: ${{ !inputs.push }}
        uses: ./.github/actions/build-docker-images
        with:
          push: false
          tag-latest: ${{ inputs.tag-latest }}
          platform: ${{ inputs.platform }}
          cli-version: ${{ inputs.cli-version }}
          alpine-tag: ${{ inputs.alpine-tag }}
          load: ${{ inputs.platform == 'linux/amd64' || inputs.platform == '' }}

      - name: Build and push Docker images
        if: ${{ inputs.push }}
        uses: ./.github/actions/build-docker-images
        with:
          push: true
          tag-latest: ${{ inputs.tag-latest }}
          platform: ${{ inputs.platform }}
          cli-version: ${{ inputs.cli-version }}
          alpine-tag: ${{ inputs.alpine-tag }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Output image tags
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_CLI_VERSION: ${{ inputs['cli-version'] }}
          INPUT_PLATFORM: ${{ inputs.platform || 'linux/amd64,linux/arm64' }}
          INPUT_PUSH: ${{ inputs.push }}
          INPUT_TAG_LATEST: ${{ inputs['tag-latest'] }}
        run: |
          {
            echo "### Docker Images Built"
            echo ""
            echo "**Git Ref:** ${INPUT_REF}"
            echo "**CLI Version:** ${INPUT_CLI_VERSION}"
            echo "**Platform:** ${INPUT_PLATFORM}"
            echo "**Pushed to Docker Hub:** ${INPUT_PUSH}"
            echo "**Tagged as latest:** ${INPUT_TAG_LATEST}"
            echo ""
            echo "**Image Tags:**"
            echo "- temporaliotest/server:sha-${GITHUB_SHA:0:7}"
            echo "- temporaliotest/server:sha-${GITHUB_SHA}"
            echo "- temporaliotest/admin-tools:sha-${GITHUB_SHA:0:7}"
            echo "- temporaliotest/admin-tools:sha-${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
